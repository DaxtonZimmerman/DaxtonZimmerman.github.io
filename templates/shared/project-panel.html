<section
  role="tabpanel"
  tabindex="0"
  id="preview-panel-{{ID}}"
  aria-labelledby="preview-tab-{{ID}}"
  {{HIDDEN}}
>
  <div class="preview-browser">
    <span aria-hidden="true">● ● ●</span
    ><img
      src="assets/{{IMAGE}}"
      alt="{{NAME}} website preview"
      width="1440"
      height="900"
      loading="lazy"
    />
  </div>
  <p class="preview-type">{{TYPE}}</p>
  <h3>{{NAME}}</h3>
  <p class="preview-description">{{SUMMARY}}</p>
  <a class="button button-primary" href="work/{{ID}}.html">Read the project story </a>
</section>
