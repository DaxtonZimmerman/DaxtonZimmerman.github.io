<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <clipPath id="photo"><rect width="1080" height="1110" /></clipPath>
    <linearGradient id="header-shade" x2="0" y2="1">
      <stop stop-color="#131e33" stop-opacity=".94" />
      <stop offset="1" stop-color="#131e33" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="title-shade" x2="0" y2="1">
      <stop stop-color="#131e33" stop-opacity="0" />
      <stop offset=".52" stop-color="#131e33" stop-opacity=".74" />
      <stop offset="1" stop-color="#131e33" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#131e33" />
  <image href="garden.jpg" width="1080" height="1110" preserveAspectRatio="xMinYMid slice" clip-path="url(#photo)" />
  <rect width="1080" height="224" fill="url(#header-shade)" />
  <rect y="495" width="1080" height="615" fill="url(#title-shade)" />

  <g font-family="Helvetica, Arial, sans-serif" fill="#fff8e9">
    <text x="64" y="76" font-size="24" letter-spacing="4">AGENT NAME</text>
    <text x="1016" y="76" text-anchor="end" font-size="21" letter-spacing="3">SAMPLE DESIGN</text>
    <path d="M64 107H1016" stroke="#f2ca81" stroke-opacity=".75" />

    <text x="67" y="884" font-size="54" letter-spacing="13" font-weight="700" fill="#f2ca81">JUST</text>
    <text x="52" y="1085" font-size="252" letter-spacing="-12" font-weight="700">SOLD</text>
    <path d="M746 976V1085" stroke="#f2ca81" stroke-width="2" />
    <text x="775" y="1011" font-size="21" letter-spacing="3" fill="#f2ca81">CLOSING DATE</text>
    <text x="775" y="1065" font-size="32">Month / Year</text>

    <path d="M64 1140H1016" stroke="#f2ca81" stroke-opacity=".65" />
    <text x="64" y="1225" font-size="43" font-weight="700">Property address</text>
    <text x="66" y="1274" font-size="24" letter-spacing="4" fill="#f2ca81">CITY, STATE</text>
  </g>
</svg>
